name: CI

on:
  push:
  pull_request:

env:
  GCP_PROJECT: seetree-map-markers
  GCP_REGION: europe-west1

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ci-placeholder

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [server, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy server
        id: server
        run: |
          gcloud run deploy markers-server --source server --quiet \
            --region "$GCP_REGION" --allow-unauthenticated --max-instances 1 --port 8000 \
            --service-account "markers-server@$GCP_PROJECT.iam.gserviceaccount.com" \
            --update-env-vars "MARKERS_FILE=/data/markers.json" \
            --add-volume name=data,type=cloud-storage,bucket=seetree-map-markers-data \
            --add-volume-mount volume=data,mount-path=/data
          echo "url=$(gcloud run services describe markers-server --region "$GCP_REGION" --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Build and push client image
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build client -t "$IMAGE" \
            --build-arg "VITE_MAPBOX_TOKEN=$VITE_MAPBOX_TOKEN" \
            --build-arg "VITE_API_URL=${{ steps.server.outputs.url }}"
          docker push "$IMAGE"
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/markers/client:${{ github.sha }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Deploy client
        id: client
        run: |
          gcloud run deploy markers-client --quiet --region "$GCP_REGION" \
            --image "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/markers/client:${{ github.sha }}" \
            --allow-unauthenticated --max-instances 1 --port 80
          echo "url=$(gcloud run services describe markers-client --region "$GCP_REGION" --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Allow the client origin on the server
        run: |
          gcloud run services update markers-server --quiet --region "$GCP_REGION" \
            --update-env-vars "ALLOWED_ORIGINS=${{ steps.client.outputs.url }}"
          echo "Client: ${{ steps.client.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Server: ${{ steps.server.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
